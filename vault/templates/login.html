
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Password Manager</title>

    <style>
        * {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f1f3f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    color: #1e293b;
}

.container {
    background: white;
    padding: 40px 35px;
    border-radius: 16px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
}

h1 {
    text-align: center;
    color: #273469;
    font-size: 30px;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 12px 14px;
    margin: 10px 0;
    border: 1px solid #d8deeb;
    border-radius: 8px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #6366f1;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background-color: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background-color: #3730a3;
}

p {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}

a {
    color: #4f46e5;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
    </style>
</head>

<body>
    <div class="container">
        <h1>Login</h1>
        
{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}


        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username"
                   placeholder="Enter username" required>

            <input type="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="/register/">Register here</a>
        </p>
    </div>
</body>
</html>
