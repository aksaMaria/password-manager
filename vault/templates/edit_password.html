
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Saved Account - Password Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f9;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        h2 {
            text-align: center;
            color: #273469;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            border: 1px solid #d8deeb;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #3730a3;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Edit Saved Account</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Website:</label>
            <input type="text" name="website"
                   value="{{ saved_password.website }}" required>

            <label>Username:</label>
            <input type="text" name="username"
                   value="{{ saved_password.username }}" required>

            <label>New Password:</label>
            <input type="password" name="password"
                   placeholder="Leave blank to keep current password">

            <label>Category:</label>
            <input type="text" name="category"
                   value="{{ saved_password.category }}">

            <label>Notes:</label>
            <textarea name="notes">{{ saved_password.notes }}</textarea>

            <button type="submit">Update Account</button>
        </form>

        <a href="{% url 'vault' %}" class="back-link">
            ← Back to Vault
        </a>

    </div>

</body>
</html>
